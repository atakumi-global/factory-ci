name: self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: governed-files tests
        run: bash tests/governed-files.test.sh
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint .github/workflows/*.yml
