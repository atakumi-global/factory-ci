# Copy to <repo>/.github/workflows/promote-to-stage.yml
name: Promote to stage

on:
  workflow_dispatch:

jobs:
  promote:
    uses: atakumi-global/factory-ci/.github/workflows/promote.yml@v1
    with:
      source: dev
      target: stage
      environment: stage
    secrets: inherit          # PROMOTE_DEPLOY_KEY, created by setup-project (repository or environment secret)
    permissions:
      contents: write
      checks: read
      statuses: read
